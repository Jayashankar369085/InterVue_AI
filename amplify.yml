version: 1

env:
  variables:
    INTERVIEWS_TABLE_NAME: InterVueInterviews
    NEXT_PUBLIC_DEMO_MODE: "false"
    # Build-time flag that enables the ElevenLabs interviewer-voice path in the
    # client (browser TTS is the fallback when this is absent/falsy).
    NEXT_PUBLIC_HAS_INTERVIEWER_VOICE: "true"

frontend:
  phases:
    preBuild:
      commands:
        - npm ci

    build:
      commands:
        # Amplify console variables are available at BUILD time only — the Next.js
        # SSR runtime never sees them. AWS's documented mechanism is to bake the
        # needed names into .env.production before `next build`:
        # https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
        # LLM_API_KEY and ASSEMBLYAI_API_KEY are console "Use secrets" entries —
        # values are redirected straight into the env file, never printed to logs.
        # `|| true` so a missing variable can never fail the build (grep exits 1).
        - env | grep -e INTERVIEWS_TABLE_NAME -e NEXT_PUBLIC_DEMO_MODE -e NEXT_PUBLIC_HAS_INTERVIEWER_VOICE -e LLM_API_KEY -e ASSEMBLYAI_API_KEY -e GROQ_API_KEY -e ELEVENLABS_API_KEY >> .env.production || true
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*